<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Chat - Multi-Provider AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="API/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="API/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="API/img/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #13131a;
      --bg-tertiary: #1c1c26;
      --text-primary: #f0f0f5;
      --text-secondary: #a8a8b8;
      --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      --gradient-5: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      --gradient-6: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
      --accent-purple: #b794f6;
      --accent-pink: #f687b3;
      --accent-blue: #63b3ed;
      --accent-green: #68d391;
      --accent-orange: #fc8181;
      --success: #48bb78;
      --error: #f56565;
      --border: #2d2d3a;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at top left, rgba(102, 126, 234, 0.15), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(245, 87, 108, 0.15), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .topbar {
      background: rgba(19, 19, 26, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .topbar label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .topbar label i {
      font-size: 1.1rem;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    select, input[type="text"] {
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 0.625rem 0.875rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      position: relative;
    }

    select {
      cursor: pointer;
      min-width: 180px;
      background-image: linear-gradient(to bottom, transparent, rgba(102, 126, 234, 0.05));
      font-weight: 500;
    }

    select:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(183, 148, 246, 0.15);
      transform: translateY(-1px);
    }

    select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 4px rgba(183, 148, 246, 0.2);
    }

    select option {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 0.5rem;
    }

    input[type="text"]:hover {
      border-color: var(--accent-pink);
    }

    input[type="text"]:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 4px rgba(246, 135, 179, 0.2);
    }

    #apiKey {
      min-width: 200px;
      flex: 1;
      max-width: 250px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2rem 1.5rem;
      scroll-behavior: smooth;
      position: relative;
    }

    .chat-container::-webkit-scrollbar {
      width: 10px;
    }

    .chat-container::-webkit-scrollbar-track {
      background: var(--bg-primary);
      border-radius: 5px;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: var(--gradient-1);
      border-radius: 5px;
    }

    .chat-container::-webkit-scrollbar-thumb:hover {
      opacity: 0.8;
    }

    .message {
      margin-bottom: 2rem;
      animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .message.user .message-content {
      background: var(--gradient-1);
      color: white;
      padding: 1rem 1.25rem;
      border-radius: 20px 20px 4px 20px;
      max-width: 70%;
      word-wrap: break-word;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      font-weight: 500;
    }

    .message.assistant {
      display: flex;
      gap: 0.875rem;
      align-items: flex-start;
    }

    .message.assistant .avatar {
      width: 36px;
      height: 36px;
      background: var(--gradient-5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 4px 12px rgba(252, 129, 129, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 12px rgba(252, 129, 129, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 4px 20px rgba(252, 129, 129, 0.5);
      }
    }

    .message.assistant .avatar::before {
      content: '✨';
      font-size: 1.1rem;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% {
        transform: rotate(0deg) scale(1);
        filter: brightness(1);
      }
      25% {
        transform: rotate(-10deg) scale(1.1);
        filter: brightness(1.2);
      }
      50% {
        transform: rotate(10deg) scale(1);
        filter: brightness(1);
      }
      75% {
        transform: rotate(-5deg) scale(1.1);
        filter: brightness(1.2);
      }
    }

    .message.assistant .message-content {
      background: rgba(28, 28, 38, 0.8);
      backdrop-filter: blur(10px);
      padding: 1.125rem 1.375rem;
      border-radius: 4px 20px 20px 20px;
      max-width: 75%;
      border: 1px solid var(--border);
      line-height: 1.7;
      box-shadow: 0 4px 20px var(--shadow);
    }

    .message.assistant .message-content img {
      max-width: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      margin-top: 0.75rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: block;
      border: 2px solid transparent;
      object-fit: contain;
    }

    .message.assistant .message-content img:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
      border-color: var(--accent-purple);
    }

    .message.assistant .message-content code {
      background: rgba(102, 126, 234, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.875em;
      color: var(--accent-blue);
      border: 1px solid rgba(102, 126, 234, 0.2);
    }

    .message.assistant .message-content pre {
      background: rgba(28, 28, 38, 0.95);
      padding: 1.25rem;
      border-radius: 10px;
      overflow-x: auto;
      margin: 0.75rem 0;
      border: 1px solid var(--border);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .message.assistant .message-content pre code {
      background: none;
      padding: 0;
      color: var(--text-primary);
      border: none;
    }

    .skeleton-loader {
      width: 100%;
      max-width: 512px;
      aspect-ratio: 1 / 1;
      background: linear-gradient(
        110deg,
        rgba(45, 45, 58, 0.7) 0%,
        rgba(45, 45, 58, 0.7) 40%,
        rgba(102, 126, 234, 0.4) 50%,
        rgba(245, 87, 108, 0.3) 55%,
        rgba(45, 45, 58, 0.7) 60%,
        rgba(45, 45, 58, 0.7) 100%
      );
      background-size: 200% 100%;
      animation: skeleton 2s ease-in-out infinite;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(102, 126, 234, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 40px rgba(102, 126, 234, 0.1);
    }

    .skeleton-loader[data-ratio="square"] {
      aspect-ratio: 1 / 1;
    }

    .skeleton-loader[data-ratio="portrait"] {
      aspect-ratio: 3 / 4;
    }

    .skeleton-loader[data-ratio="landscape"] {
      aspect-ratio: 4 / 3;
    }

    .skeleton-loader[data-ratio="wide"] {
      aspect-ratio: 16 / 9;
    }

    .skeleton-loader[data-ratio="ultrawide"] {
      aspect-ratio: 9 / 16;
    }

    .skeleton-loader::before {
      content: '✨';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6));
    }

    .skeleton-loader::after {
      content: '🎨 Generating your masterpiece...';
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent-purple);
      font-size: 0.9375rem;
      font-weight: 600;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.8);
      background: rgba(19, 19, 26, 0.8);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(102, 126, 234, 0.3);
      white-space: nowrap;
    }

    @keyframes skeleton {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    .input-area {
      background: rgba(19, 19, 26, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-wrapper {
      display: flex;
      gap: 0.875rem;
      max-width: 1200px;
      margin: 0 auto;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 1rem 1.25rem;
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 200px;
      min-height: 56px;
      line-height: 1.5;
      overflow-y: auto;
    }

    #input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 4px rgba(183, 148, 246, 0.2);
      background: rgba(28, 28, 38, 0.95);
    }

    #input::placeholder {
      color: var(--text-secondary);
    }

    #input::-webkit-scrollbar {
      width: 6px;
    }

    #input::-webkit-scrollbar-track {
      background: transparent;
    }

    #input::-webkit-scrollbar-thumb {
      background: var(--accent-purple);
      border-radius: 3px;
    }

    #submit {
      background: var(--gradient-1);
      color: white;
      border: none;
      padding: 0 2rem;
      height: 50px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    #submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
    }

    #submit:active:not(:disabled) {
      transform: translateY(0);
    }

    #submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s;
      backdrop-filter: blur(5px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
      animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-content img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      border: 2px solid var(--accent-purple);
    }

    .modal-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: var(--gradient-2);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }

    .modal-close:hover {
      transform: rotate(90deg) scale(1.1);
    }

    .toast {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: rgba(28, 28, 38, 0.95);
      backdrop-filter: blur(20px);
      color: var(--text-primary);
      padding: 1.125rem 1.625rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 35px var(--shadow);
      display: flex;
      align-items: center;
      gap: 0.875rem;
      min-width: 320px;
      z-index: 2000;
      animation: slideInDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast.error {
      border-left: 4px solid var(--error);
      background: rgba(245, 101, 101, 0.1);
    }

    .toast.success {
      border-left: 4px solid var(--success);
      background: rgba(72, 187, 120, 0.1);
    }

    .toast.info {
      border-left: 4px solid var(--accent-purple);
      background: rgba(183, 148, 246, 0.1);
    }

    .toast i {
      font-size: 1.375rem;
    }

    .toast.error i {
      color: var(--error);
    }

    .toast.success i {
      color: var(--success);
    }

    .toast.info i {
      color: var(--accent-purple);
    }

    footer {
      text-align: center;
      padding: 0.625rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      background: rgba(19, 19, 26, 0.8);
      backdrop-filter: blur(10px);
    }

    footer a {
      color: var(--accent-purple);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent-pink);
    }

    .loading-dots {
      display: inline-flex;
      gap: 5px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gradient-3);
      animation: bounce 1.4s infinite ease-in-out;
    }

    .loading-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    @media (max-width: 1024px) {
      .message.user .message-content,
      .message.assistant .message-content {
        max-width: 80%;
      }
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 1rem;
        gap: 0.75rem;
      }

      .topbar-group {
        flex: 1 1 100%;
        min-width: 100%;
      }

      .topbar label {
        flex: 1;
      }

      select, #apiKey {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
      }

      .chat-container {
        padding: 1.5rem 1rem;
        padding-top: 4.5rem;
      }

      .message.user .message-content {
        max-width: 85%;
        padding: 0.875rem 1rem;
        font-size: 0.9375rem;
      }

      .message.assistant {
        gap: 0.625rem;
      }

      .message.assistant .avatar {
        width: 32px;
        height: 32px;
      }

      .message.assistant .message-content {
        max-width: 85%;
        padding: 1rem 1.125rem;
        font-size: 0.9375rem;
      }

      .input-area {
        padding: 1rem;
      }

      .input-wrapper {
        gap: 0.625rem;
      }

      #input {
        padding: 0.875rem 1rem;
        font-size: 0.9375rem;
      }

      #submit {
        padding: 0 1.25rem;
        height: 46px;
      }

      #submit span {
        display: none;
      }

      .toast {
        right: 1rem;
        left: 1rem;
        min-width: auto;
        padding: 1rem 1.25rem;
        max-width: calc(100vw - 2rem);
      }

      .modal-close {
        top: -50px;
        right: 50%;
        transform: translateX(50%);
      }

      .skeleton-loader {
        max-width: 100%;
      }
    }

    @media (max-width: 480px) {
      .chat-container {
        padding: 1rem 0.75rem;
        padding-top: 4.5rem;
      }

      .message {
        margin-bottom: 1.5rem;
      }

      .message.user .message-content,
      .message.assistant .message-content {
        max-width: 90%;
        padding: 0.75rem 0.875rem;
        font-size: 0.875rem;
      }

      .message.assistant .avatar {
        width: 28px;
        height: 28px;
      }

      .input-area {
        padding: 0.875rem 0.75rem;
      }

      #input {
        padding: 0.75rem 0.875rem;
        font-size: 0.875rem;
        border-radius: 12px;
      }

      #submit {
        padding: 0 1rem;
        height: 44px;
        border-radius: 12px;
      }

      #submit i {
        font-size: 1rem;
      }

      .skeleton-loader {
        max-width: 100%;
      }

      .toast {
        font-size: 0.875rem;
        padding: 0.875rem 1rem;
      }
    }

    @media (min-width: 1400px) {
      .app-container {
        max-width: 1600px;
      }
    }

    /* Hamburger Menu Styles */
    .menu-button {
      position: fixed;
      top: 1.25rem !important;
      left: 1.25rem !important;
      width: 48px;
      height: 48px;
      background: var(--gradient-1);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateZ(0);
    }

    .menu-button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
    }

    .menu-button i {
      color: white;
      font-size: 1.25rem;
      transition: transform 0.3s;
    }

    .menu-button.active i {
      transform: rotate(90deg);
    }

    .sidebar-menu {
      position: fixed !important;
      top: 0;
      left: -100%;
      width: 340px;
      height: 100vh;
      background: linear-gradient(180deg, rgba(19, 19, 26, 0.99) 0%, rgba(13, 13, 18, 0.99) 100%);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      z-index: 10000;
      transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;

    .custom-option.selected {
      background: rgba(102, 126, 234, 0.2);

    .custom-option-icon {

<body>
  <!-- Menu Button -->
  <button class="menu-button" id="menuButton">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Menu Overlay -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- Sidebar Menu -->
  <div class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-content">
      <h2 class="sidebar-title">⚙️ Settings</h2>

      <div class="menu-section">
        <div class="menu-section-title">
          <i class="fas fa-server"></i>
          Provider
        </div>
        <div class="custom-select-wrapper">
          <div class="custom-select" id="providerCustomSelect">
            <div class="custom-select-label">
              <div class="custom-select-icon provider-icon">
                <i class="fas fa-globe"></i>
              </div>
              <span id="selectedProviderText">Loading...</span>
            </div>
            <i class="fas fa-chevron-down custom-select-arrow"></i>
          </div>
          <div class="custom-options" id="providerOptions"></div>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-section-title">
          <i class="fas fa-brain"></i>
          Model
        </div>
        <div class="custom-select-wrapper">
          <div class="custom-select" id="modelCustomSelect">
            <div class="custom-select-label">
              <div class="custom-select-icon model-icon">
                <i class="fas fa-robot"></i>
              </div>
              <span id="selectedModelText">Loading...</span>
            </div>
            <i class="fas fa-chevron-down custom-select-arrow"></i>
          </div>
          <div class="custom-options" id="modelOptions"></div>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-section-title">
          <i class="fas fa-key"></i>
          API Key
        </div>
        <input type="text" class="api-key-input" id="apiKeyInput" placeholder="Enter API Key (Optional)" />
      </div>

      <div class="menu-divider"></div>

      <div class="menu-section history-section">
        <div class="menu-section-title history-header">
          <div class="history-title-left">
            <i class="fas fa-clock-rotate-left"></i>
            Chat History
          </div>
          <button class="new-chat-btn" id="newChatBtn" title="New Chat">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-empty">
            <i class="fas fa-comments"></i>
            <p>No chat history yet</p>
            <span>Start a conversation to see it here</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="topbar" style="display: none;">
      <div class="topbar-group">
        <label>
          <i class="fas fa-server"></i>
          <select id="provider">
            <option disabled selected>Loading...</option>
          </select>
        </label>
      </div>
      <div class="topbar-group">
        <label>
          <i class="fas fa-brain"></i>
          <select id="modelSelect">
            <option value="" disabled selected>Loading...</option>
          </select>
        </label>
      </div>
      <div class="topbar-group">
        <label>
          <i class="fas fa-key"></i>
          <input type="text" id="apiKey" placeholder="API Key (Optional)" />
        </label>
      </div>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="input-area">
      <form class="input-wrapper" id="form">
        <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
        <button type="submit" id="submit">
          <i class="fas fa-paper-plane"></i>
          <span>Send</span>
        </button>
      </form>
    </div>

    <footer>
      Made with ♥️ by NZ R
    </footer>
  </div>

  <div class="modal" id="imageModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">
        <i class="fas fa-times"></i>
      </button>
      <img id="modalImage" src="" alt="Preview">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsencrypt/bin/jsencrypt.min.js"></script>
  <script src="API/js/framework.js"></script>
  <script type="module">
    import providers, { createClient } from "./API/js/providers.js";
    import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";

    const { list_conversations, save_conversation, get_conversation, delete_conversation } = window;

    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const submitBtn = document.getElementById('submit');
    const providerSelect = document.getElementById('provider');
    const apiKeyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('modelSelect');
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');

    const menuButton = document.getElementById('menuButton');
    const sidebarMenu = document.getElementById('sidebarMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const providerCustomSelect = document.getElementById('providerCustomSelect');
    const providerOptions = document.getElementById('providerOptions');
    const selectedProviderText = document.getElementById('selectedProviderText');
    const modelCustomSelect = document.getElementById('modelCustomSelect');
    const modelOptions = document.getElementById('modelOptions');
    const selectedModelText = document.getElementById('selectedModelText');
    const apiKeyInputSidebar = document.getElementById('apiKeyInput');
    const historyList = document.getElementById('historyList');
    const newChatBtn = document.getElementById('newChatBtn');

    let client = null;
    let messages = [];
    let messageCount = 0;
    let currentConversationId = null;
    let conversations = [];

    menuButton.addEventListener('click', () => {
      sidebarMenu.classList.toggle('active');
      menuOverlay.classList.toggle('active');
      menuButton.classList.toggle('active');
    });

    menuOverlay.addEventListener('click', () => {
      sidebarMenu.classList.remove('active');
      menuOverlay.classList.remove('active');
      menuButton.classList.remove('active');
    });

    function setupCustomSelect(selectElement, optionsElement, onSelect) {
      selectElement.addEventListener('click', (e) => {
        e.stopPropagation();
        optionsElement.classList.toggle('active');
        selectElement.classList.toggle('active');

        const otherOptions = document.querySelectorAll('.custom-options');
        const otherSelects = document.querySelectorAll('.custom-select');
        otherOptions.forEach(opt => {
          if (opt !== optionsElement) opt.classList.remove('active');
        });
        otherSelects.forEach(sel => {
          if (sel !== selectElement) sel.classList.remove('active');
        });
      });

      document.addEventListener('click', (e) => {
        if (!selectElement.contains(e.target) && !optionsElement.contains(e.target)) {
          optionsElement.classList.remove('active');
          selectElement.classList.remove('active');
        }
      });

      optionsElement.addEventListener('click', (e) => {
        const option = e.target.closest('.custom-option');
        if (option) {
          const value = option.dataset.value;
          const text = option.querySelector('span').textContent;

          optionsElement.querySelectorAll('.custom-option').forEach(opt => {
            opt.classList.remove('selected');
          });
          option.classList.add('selected');

          optionsElement.classList.remove('active');
          selectElement.classList.remove('active');

          if (onSelect) onSelect(value, text, option);
        }
      });
    }

    setupCustomSelect(providerCustomSelect, providerOptions, (value, text) => {
      selectedProviderText.textContent = text;
      providerSelect.value = value;
      providerSelect.dispatchEvent(new Event('change'));
    });

    setupCustomSelect(modelCustomSelect, modelOptions, (value, text, optionElement) => {
      selectedModelText.textContent = text;
      modelSelect.value = value;

      const modelType = optionElement.dataset.type;
      const selectedOption = modelSelect.options[modelSelect.selectedIndex];
      if (selectedOption && modelType) {
        selectedOption.dataset.type = modelType;
      }
    });

    apiKeyInputSidebar.addEventListener('input', () => {
      apiKeyInput.value = apiKeyInputSidebar.value;
      apiKeyInput.dispatchEvent(new Event('change'));
    });

    function addCopyButtonsToCode() {
      document.querySelectorAll('pre code').forEach((codeBlock) => {
        if (codeBlock.parentElement.parentElement.classList.contains('code-block-wrapper')) {
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
        copyBtn.setAttribute('title', 'Copy code');

        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(codeBlock.textContent);
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = '<i class="fas fa-check"></i>';

            setTimeout(() => {
              copyBtn.classList.remove('copied');
              copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
            }, 2000);
          } catch (err) {
            console.error('Failed to copy:', err);
          }
        });

        const pre = codeBlock.parentElement;
        pre.parentElement.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(copyBtn);
      });
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const icon = type === 'error' ? 'fa-circle-exclamation' : 
                   type === 'success' ? 'fa-circle-check' : 'fa-circle-info';

      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <div>${message}</div>
      `;

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) reverse';
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    window.closeModal = function() {
      modal.classList.remove('active');
    };

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    providerSelect.innerHTML = '';
    providerOptions.innerHTML = '';
    const gradients = ['--gradient-1', '--gradient-2', '--gradient-3', '--gradient-4', '--gradient-5', '--gradient-6'];
    let gradientIndex = 0;

    for (const key of Object.keys(providers)) {
      providerSelect.appendChild(new Option(key, key));

      const gradient = gradients[gradientIndex % gradients.length];
      gradientIndex++;

      const option = document.createElement('div');
      option.className = 'custom-option';
      option.dataset.value = key;
      option.innerHTML = `
        <div class="custom-option-icon" style="background: var(${gradient})">
          <i class="fas fa-server"></i>
        </div>
        <span>${key}</span>
      `;
      providerOptions.appendChild(option);
    }

    if (Object.keys(providers).length > 0) {
      const firstProvider = Object.keys(providers)[0];
      selectedProviderText.textContent = firstProvider;
      providerOptions.querySelector('.custom-option').classList.add('selected');
    }

    async function initClient() {
      try {
        const provider = providerSelect.value;
        const apiKey = apiKeyInput.value.trim();
        const options = apiKey ? { apiKey } : {};
        client = createClient(provider, options);
        await loadModels();
        showToast(`Connected to ${provider}`, 'success');
      } catch (err) {
        showToast(`Failed to connect: ${err.message}`, 'error');
      }
    }

    async function loadModels() {
      modelSelect.innerHTML = '<option disabled selected>Loading...</option>';
      selectedModelText.textContent = 'Loading...';
      modelOptions.innerHTML = '';

      try {
        const models = await client.models.list();
        modelSelect.innerHTML = '';
        modelOptions.innerHTML = '';

        const modelGradients = ['--gradient-2', '--gradient-3', '--gradient-4', '--gradient-5', '--gradient-1'];
        let modelGradientIndex = 0;

        models.forEach(model => {
          if (model.type && !["chat", "image", "text"].includes(model.type)) {
            return;
          }

          const opt = document.createElement('option');
          opt.value = model.id;
          const icon = model.type === "image" ? " 🎨" : "";
          opt.textContent = `${model.id}${icon}`;
          if (model.type) {
            opt.dataset.type = model.type;
          }
          if (model.id === client.defaultModel) opt.selected = true;
          modelSelect.appendChild(opt);

          const gradient = modelGradients[modelGradientIndex % modelGradients.length];
          modelGradientIndex++;

          const customOption = document.createElement('div');
          customOption.className = 'custom-option';
          if (model.id === client.defaultModel) customOption.classList.add('selected');
          customOption.dataset.value = model.id;
          customOption.dataset.type = model.type || 'chat';
          customOption.innerHTML = `
            <div class="custom-option-icon" style="background: var(${gradient})">
              <i class="fas ${model.type === 'image' ? 'fa-image' : 'fa-comments'}"></i>
            </div>
            <span>${model.id}${icon}</span>
          `;
          modelOptions.appendChild(customOption);

          if (model.id === client.defaultModel) {
            selectedModelText.textContent = model.id + icon;
          }
        });
      } catch (err) {
        console.error('Model load failed:', err);
        showToast('Failed to load models', 'error');
        modelSelect.innerHTML = '<option disabled selected>Error loading models</option>';
        selectedModelText.textContent = 'Error loading models';
      }
    }

    providerSelect.addEventListener('change', initClient);
    apiKeyInput.addEventListener('change', initClient);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !client) {
        if (!client) showToast('Please wait for provider to connect', 'error');
        return;
      }

      const selectedOption = modelSelect.options[modelSelect.selectedIndex];
      const selectedModel = selectedOption.value || client.defaultModel;
      const modelType = selectedOption.dataset.type || 'chat';

      addMessage('user', text);
      messages.push({ role: 'user', content: text });
      input.value = '';
      submitBtn.disabled = true;

      const assistantEl = document.createElement('div');
      assistantEl.className = 'message assistant';
      assistantEl.style.animationDelay = `${messageCount * 0.05}s`;
      messageCount++;

      assistantEl.innerHTML = `
        <div class="avatar"></div>
        <div class="message-content">
          ${modelType === 'image' ? '<div class="skeleton-loader" data-ratio="square"></div>' : '<div class="loading-dots"><span></span><span></span><span></span></div>'}
        </div>
      `;
      chat.appendChild(assistantEl);
      chat.scrollTop = chat.scrollHeight;

      const contentEl = assistantEl.querySelector('.message-content');

      try {
        if (modelType === 'image') {
          const response = await client.images.generate({
            model: selectedModel,
            prompt: text,
          });

          const imageUrl = response.data[0].url;
          
          const img = new Image();
          img.onload = function() {
            const aspectRatio = this.width / this.height;
            let ratioClass = 'square';
            
            if (aspectRatio > 1.5) ratioClass = 'wide';
            else if (aspectRatio > 1.2) ratioClass = 'landscape';
            else if (aspectRatio < 0.67) ratioClass = 'ultrawide';
            else if (aspectRatio < 0.85) ratioClass = 'portrait';
            
            contentEl.innerHTML = `<img src="${imageUrl}" alt="${text}" onclick="openImage('${imageUrl}')" data-ratio="${ratioClass}" style="border-radius: 12px; display: block; max-width: 100%;" />`;
          };
          img.onerror = function() {
            contentEl.innerHTML = `<img src="${imageUrl}" alt="${text}" onclick="openImage('${imageUrl}')" style="border-radius: 12px; display: block; max-width: 100%;" />`;
          };
          img.src = imageUrl;
          
          messages.push({ role: 'assistant', content: `Image generated: ${imageUrl}` });
          showToast('Image generated successfully', 'success');

        } else {
          const stream = await client.chat.completions.create({
            model: selectedModel,
            messages,
            stream: true
          });

          let fullResponse = '';
          let isReasoning = false;
          for await (const chunk of stream) {
            let delta;
            if (chunk.choices && chunk.choices[0]?.delta?.reasoning) {
              delta = chunk.choices[0]?.delta?.reasoning;
              isReasoning = true;
            } else if (chunk.choices) {
              delta = chunk.choices[0]?.delta?.content || '';
              if (isReasoning) {
                isReasoning = false;
                delta = '\n\n---\n\n' + delta;
              }
            }
            if (!delta) continue;
            fullResponse += delta;
            contentEl.innerHTML = marked.parse(fullResponse);

            contentEl.querySelectorAll('img').forEach(img => {
              img.onclick = () => openImage(img.src);
            });

            addCopyButtonsToCode();

            chat.scrollTop = chat.scrollHeight;
          }
          messages.push({ role: 'assistant', content: fullResponse });
        }

        await saveCurrentConversation();
      } catch (err) {
        contentEl.innerHTML = `<strong style="color: var(--error);">Error:</strong> ${err.message}`;
        showToast(`Error: ${err.message}`, 'error');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        input.focus();
        input.style.height = 'auto';
      }
    });

    function addMessage(role, content) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.style.animationDelay = `${messageCount * 0.05}s`;
      messageCount++;

      if (role === 'user') {
        const escapedContent = content.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        el.innerHTML = `<div class="message-content">${escapedContent}</div>`;
      } else {
        el.innerHTML = `
          <div class="avatar"></div>
          <div class="message-content">${marked.parse(content)}</div>
        `;

        setTimeout(() => {
          el.querySelectorAll('img').forEach(img => {
            img.onclick = () => openImage(img.src);
          });
          addCopyButtonsToCode();
        }, 100);
      }

      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    window.openImage = function(src) {
      modalImage.src = src;
      modal.classList.add('active');
    };

    function autoResizeTextarea() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }

    input.addEventListener('input', autoResizeTextarea);

    async function generateChatTitle(firstMessage) {
      try {
        const prompt = `Generate a short, concise 3-6 word title for a chat conversation that starts with this message: "${firstMessage.substring(0, 200)}". Return ONLY the title, no quotes, no explanation.`;
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
        if (response.ok) {
          let title = await response.text();
          title = title.trim().replace(/^["']|["']$/g, '').substring(0, 50);
          return title || 'New Chat';
        }
      } catch (e) {
        console.error('Title generation failed:', e);
      }
      return firstMessage.substring(0, 30) + (firstMessage.length > 30 ? '...' : '');
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      return date.toLocaleDateString();
    }

    async function loadHistory() {
      try {
        conversations = await list_conversations();
        conversations.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
        renderHistoryList();
      } catch (e) {
        console.error('Failed to load history:', e);
      }
    }

    function renderHistoryList() {
      if (conversations.length === 0) {
        historyList.innerHTML = `
          <div class="history-empty">
            <i class="fas fa-comments"></i>
            <p>No chat history yet</p>
            <span>Start a conversation to see it here</span>
          </div>
        `;
        return;
      }

      historyList.innerHTML = conversations.map(conv => `
        <div class="history-item ${conv.id === currentConversationId ? 'active' : ''}" data-id="${conv.id}">
          <div class="history-item-icon">
            <i class="fas fa-message"></i>
          </div>
          <div class="history-item-content">
            <div class="history-item-title">${escapeHtml(conv.title || 'Untitled Chat')}</div>
            <div class="history-item-meta">
              <span class="history-item-provider"><i class="fas fa-server"></i> ${conv.provider || 'Unknown'}</span>
              <span class="history-item-date">${formatDate(conv.updatedAt || conv.createdAt)}</span>
            </div>
          </div>
          <button class="history-item-delete" onclick="event.stopPropagation(); deleteConversation('${conv.id}')" title="Delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `).join('');

      historyList.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => loadConversation(item.dataset.id));
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function saveCurrentConversation() {
      if (messages.length < 2) return;

      const userMessages = messages.filter(m => m.role === 'user');
      if (userMessages.length === 0) return;

      const conv = {
        id: currentConversationId || Date.now().toString(),
        title: null,
        messages: messages,
        provider: providerSelect.value,
        model: modelSelect.value,
        createdAt: currentConversationId ? (conversations.find(c => c.id === currentConversationId)?.createdAt || Date.now()) : Date.now(),
        updatedAt: Date.now()
      };

      const existingConv = conversations.find(c => c.id === conv.id);
      if (existingConv) {
        conv.title = existingConv.title;
      } else {
        conv.title = await generateChatTitle(userMessages[0].content);
      }

      currentConversationId = conv.id;

      try {
        await save_conversation(conv);
        await loadHistory();
      } catch (e) {
        console.error('Failed to save conversation:', e);
      }
    }

    async function loadConversation(id) {
      try {
        const conv = await get_conversation(id);
        if (!conv) return;

        currentConversationId = id;
        messages = conv.messages || [];
        messageCount = 0;

        chat.innerHTML = '';
        messages.forEach(msg => {
          addMessage(msg.role, msg.content);
        });

        sidebarMenu.classList.remove('active');
        menuOverlay.classList.remove('active');
        menuButton.classList.remove('active');

        renderHistoryList();
        showToast(`Loaded: ${conv.title}`, 'info');
      } catch (e) {
        console.error('Failed to load conversation:', e);
        showToast('Failed to load conversation', 'error');
      }
    }

    window.deleteConversation = async function(id) {
      try {
        await delete_conversation(id);
        if (currentConversationId === id) {
          startNewChat();
        }
        await loadHistory();
        showToast('Conversation deleted', 'success');
      } catch (e) {
        console.error('Failed to delete conversation:', e);
        showToast('Failed to delete conversation', 'error');
      }
    };

    function startNewChat() {
      currentConversationId = null;
      messages = [];
      messageCount = 0;
      chat.innerHTML = '';
      input.value = '';
      input.style.height = 'auto';
      renderHistoryList();
      showWelcomeMessage();
    }

    newChatBtn.addEventListener('click', () => {
      startNewChat();
      sidebarMenu.classList.remove('active');
      menuOverlay.classList.remove('active');
      menuButton.classList.remove('active');
      showToast('Started new chat', 'success');
    });

    await initClient();
    await loadHistory();
    
    function showWelcomeMessage() {
      const welcomeText = '**Welcome to AI Chat!**\n\nHere\'s how to get started:\n\n**Quick Guide:**\n- Click the **menu button** (top-left) to open settings\n- Choose your **Provider** (AI service)\n- Select a **Model** (chat or image generation)\n- Type your message below and hit Send!\n\n**Tips:**\n- Chat models respond to text\n- Image models generate pictures from descriptions\n- Press **Enter** for new lines in your message\n- Click **Send** button to submit\n- Your chats are saved automatically!';

      addMessage('assistant', welcomeText);
    }

    setTimeout(() => {
      showWelcomeMessage();
    }, 500);
  </script>
</body>
</html>
